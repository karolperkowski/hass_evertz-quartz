name: Validate

# Standard HACS + hassfest validation for HACS integration repos.
# Catches manifest/hacs.json/translation mistakes before users do.

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # topics/description are repo *settings*, not repo content — they
          # can't be fixed from a PR. Remove this once the repository has a
          # description and topics set (About panel on the repo main page).
          ignore: "topics description"

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
