name: Validate

# Standard HACS + hassfest validation for HACS integration repos.
# Catches manifest/hacs.json/translation mistakes before users do.

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
